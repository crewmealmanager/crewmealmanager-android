name: Build Android app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Get the app icon from the website
        run: |
          mkdir -p app/src/main/res/mipmap-xxxhdpi app/src/main/res/drawable-nodpi
          curl -fsSL https://raw.githubusercontent.com/crewmealmanager/crewmealmanager.github.io/main/icons/icon-192.png -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          curl -fsSL https://raw.githubusercontent.com/crewmealmanager/crewmealmanager.github.io/main/icons/maskable-512.png -o app/src/main/res/drawable-nodpi/ic_fg.png

      - name: Unpack the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "The KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk CrewMealManager.apk
          gh release create "v1.0.${{ github.run_number }}" CrewMealManager.apk \
            --title "Crew Meal Manager v1.0.${{ github.run_number }}" \
            --notes "Download CrewMealManager.apk on your Android phone and open it to install."
